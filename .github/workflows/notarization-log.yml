name: Notarization diagnostics

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Apple notarization submission ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  log:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Read notarization result
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APPLE_PASSWORD: ${{ secrets.NOTARY_APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/notarization.json"
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_APPLE_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            "$log"
          python3 - "$log" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          fields = ("jobId", "status", "statusCode", "statusSummary", "issues")
          print(json.dumps({field: result.get(field) for field in fields}, indent=2))
          PY
