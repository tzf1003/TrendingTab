name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_runner:
        description: macOS build runner
        type: choice
        default: macos-15-intel
        options:
          - macos-15-intel
          - macos-15

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.build_runner || 'macos-15-intel' }}
    timeout-minutes: 60
    env:
      MARKETING_VERSION: 0.2.${{ github.run_number }}
      CURRENT_PROJECT_VERSION: ${{ github.run_number }}
      ARCHS: arm64 x86_64
      SIGNING_MODE: auto

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: AgentRuntime/package-lock.json

      - name: Read Agent Runtime version
        run: |
          set -euo pipefail
          runtime_version="$(node -p 'require("./AgentRuntime/package.json").version')"
          [[ "$runtime_version" =~ ^[0-9]{1,7}\.[0-9]{1,7}\.[0-9]{1,7}$ ]]
          echo "RUNTIME_VERSION=$runtime_version" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: |
          set -euo pipefail
          zsh scripts/test-staple-retry.sh
          zsh scripts/test-create-dmg-retry.sh
          runtime="$RUNNER_TEMP/agent-runtime-test"
          zsh scripts/prepare-agent-runtime.sh "$runtime"
          cp AgentRuntime/test-runtime.mjs AgentRuntime/test-runtime-metadata.mjs AgentRuntime/test-mcp-client.mjs AgentRuntime/test-mcp-server.mjs "$runtime/"
          architecture="$(uname -m)"
          test "$architecture" = arm64 || test "$architecture" = x86_64
          (cd "$runtime" && "./bin/node-$architecture" test-runtime.mjs)
          (cd "$runtime" && "./bin/node-$architecture" test-runtime-metadata.mjs)
          (cd "$runtime" && "./bin/node-$architecture" --test test-mcp-client.mjs)
          "$runtime/bin/node-$architecture" "$runtime/runtime-health.mjs" | python3 -c \
            'import json,sys; r = json.load(sys.stdin); p=json.load(open(sys.argv[1])); assert r["protocol"] == 1 and r["streaming"] and r["tools"] and r["piVersion"] == p["dependencies"]["@earendil-works/pi-coding-agent"] and "open_current_story" in r["toolNames"]' AgentRuntime/package.json
          TRENDINGTAB_TEST_NODE="$runtime/bin/node-$architecture" \
          TRENDINGTAB_TEST_RUNTIME="$runtime/runtime.mjs" script -q /dev/null swift test
          TEST_RUNNER_TRENDINGTAB_REQUIRE_PI_INTEGRATION=1 TEST_RUNNER_TRENDINGTAB_TEST_NODE="$runtime/bin/node-$architecture" TEST_RUNNER_TRENDINGTAB_TEST_RUNTIME="$runtime/runtime.mjs" \
          xcodebuild -project TrendingTab.xcodeproj -scheme TrendingTabBrowserTests \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

      - name: Import signing material
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APP_PROVISIONING_PROFILE: ${{ secrets.APPLE_APP_PROVISIONING_PROFILE }}
          APPLE_WIDGET_PROVISIONING_PROFILE: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE_P12:-}" ] || \
             [ -z "${APPLE_APP_PROVISIONING_PROFILE:-}" ] || \
             [ -z "${APPLE_WIDGET_PROVISIONING_PROFILE:-}" ]; then
            echo "Complete Developer ID material is not configured; using an ad-hoc signed DMG."
            echo "SIGNING_MODE=ad-hoc" >> "$GITHUB_ENV"
            exit 0
          fi

          keychain="$RUNNER_TEMP/trendingtab-signing.keychain-db"
          keychain_password="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 24)}"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$APPLE_CERTIFICATE_P12" | /usr/bin/base64 -D > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          app_profile="$profiles/trendingtab-app.mobileprovision"
          widget_profile="$profiles/trendingtab-widget.mobileprovision"
          printf '%s' "$APPLE_APP_PROVISIONING_PROFILE" | /usr/bin/base64 -D > "$app_profile"
          printf '%s' "$APPLE_WIDGET_PROVISIONING_PROFILE" | /usr/bin/base64 -D > "$widget_profile"

          app_profile_id="$(
            security cms -D -i "$app_profile" |
              plutil -extract UUID raw -o - -
          )"
          widget_profile_id="$(
            security cms -D -i "$widget_profile" |
              plutil -extract UUID raw -o - -
          )"
          team_id="$(
            security cms -D -i "$app_profile" |
              plutil -extract TeamIdentifier.0 raw -o - -
          )"

          echo "TRENDINGTAB_APP_PROFILE_ID=$app_profile_id" >> "$GITHUB_ENV"
          echo "TRENDINGTAB_WIDGET_PROFILE_ID=$widget_profile_id" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_TEAM=$team_id" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: Configure notarization
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APPLE_PASSWORD: ${{ secrets.NOTARY_APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "${SIGNING_MODE:-ad-hoc}" != "developer-id" ] || \
             [ -z "${NOTARY_APPLE_ID:-}" ] || \
             [ -z "${NOTARY_APPLE_PASSWORD:-}" ] || \
             [ -z "${NOTARY_TEAM_ID:-}" ]; then
            echo "Notarization is not configured for this build."
            exit 0
          fi
          profile="TrendingTab-notary"
          xcrun notarytool store-credentials "$profile" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_APPLE_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID"
          echo "NOTARY_KEYCHAIN_PROFILE=$profile" >> "$GITHUB_ENV"

      - name: Build DMG
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
          OUTPUT_DIR: ${{ runner.temp }}/release
        run: zsh scripts/package-dmg.sh

      - name: Require signed and notarized release configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          test "${SIGNING_MODE:-}" = developer-id
          test -n "${NOTARY_KEYCHAIN_PROFILE:-}"

      - name: Build Agent Runtime component
        env:
          OUTPUT_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          if [ "${SIGNING_MODE:-}" = developer-id ] && [ -n "${NOTARY_KEYCHAIN_PROFILE:-}" ]; then
            export SIGNED_UNNOTARIZED_IMAGE="$RUNNER_TEMP/runtime-negative/TrendingTab-AgentRuntime-$RUNTIME_VERSION.dmg"
          fi
          MARKETING_VERSION="$RUNTIME_VERSION" zsh scripts/package-agent-runtime.sh

      - name: Verify DMG
        run: |
          set -euo pipefail
          dmg="$(find "${RUNNER_TEMP}/release" -name 'TrendingTab-[0-9]*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"

          attach_plist="$RUNNER_TEMP/dmg-attach.plist"
          hdiutil attach "$dmg" -nobrowse -plist > "$attach_plist"
          mount="$(
            plutil -convert json -o - "$attach_plist" |
              ruby -rjson -e 'puts JSON.parse(STDIN.read)["system-entities"].filter_map { |item| item["mount-point"] }.first'
          )"
          test -n "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          app="$mount/TrendingTab.app"
          widget="$app/Contents/PlugIns/TrendingTabWidget.appex"
          test -d "$app"
          test -d "$widget"
          codesign --verify --deep --strict --verbose=2 "$app"
          cmp AgentRuntime/LICENSES/pi-MIT.txt "$app/Contents/Resources/AgentRuntime/LICENSES/pi-MIT.txt"
          node -e 'const pkg = require(process.argv[1]); if (pkg.version !== process.env.RUNTIME_VERSION) process.exit(1)' \
            "$app/Contents/Resources/AgentRuntime/package.json"

          verification_args=("$app")
          if [ "${SIGNING_MODE:-ad-hoc}" = "developer-id" ]; then
            verification_args+=(--developer-id)
          fi
          python3 scripts/verify-bundle.py "${verification_args[@]}"

          app_entitlements="$(codesign -d --entitlements :- "$app" 2>&1)"
          widget_entitlements="$(codesign -d --entitlements :- "$widget" 2>&1)"
          printf '%s\n' "$app_entitlements" | grep -F 'group.dev.trendingtab.shared'
          printf '%s\n' "$widget_entitlements" | grep -F 'com.apple.security.app-sandbox'
          printf '%s\n' "$widget_entitlements" | grep -F 'group.dev.trendingtab.shared'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' \
            "$widget/Contents/Info.plist" |
            grep -Fx 'com.apple.widgetkit-extension'

          if [ "${SIGNING_MODE:-ad-hoc}" = "developer-id" ] && \
             [ -n "${NOTARY_KEYCHAIN_PROFILE:-}" ]; then
            zsh "$GITHUB_WORKSPACE/scripts/staple-with-retry.sh" "$dmg" validate
            spctl --assess --type execute --verbose=2 "$app"
          fi
          echo "Verified $dmg"

      - name: Verify Agent Runtime component
        run: |
          set -euo pipefail
          dmg="$(find "${RUNNER_TEMP}/release" -name 'TrendingTab-AgentRuntime-*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"
          if [ "${SIGNING_MODE:-ad-hoc}" = developer-id ]; then
            codesign --verify --strict -R '=anchor apple generic and certificate leaf[subject.OU] = "GJUT2BVM7R" and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$dmg"
          fi
          if [ -n "${NOTARY_KEYCHAIN_PROFILE:-}" ]; then zsh scripts/staple-with-retry.sh "$dmg" validate; fi
          plist="$RUNNER_TEMP/runtime-attach.plist"
          hdiutil attach "$dmg" -readonly -nobrowse -plist > "$plist"
          mount="$(plutil -convert json -o - "$plist" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["system-entities"].filter_map { |item| item["mount-point"] }.first')"
          test -n "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          app="$mount/AgentRuntime.app"
          codesign --verify --deep --strict "$app"
          cmp AgentRuntime/LICENSES/pi-MIT.txt "$app/Contents/Resources/LICENSES/pi-MIT.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$RUNTIME_VERSION"
          node -e 'const pkg = require(process.argv[1]); if (pkg.version !== process.env.RUNTIME_VERSION) process.exit(1)' \
            "$app/Contents/Resources/package.json"
          lipo "$app/Contents/MacOS/node" -verify_arch arm64
          lipo "$app/Contents/MacOS/node" -verify_arch x86_64
          "$app/Contents/MacOS/node" "$app/Contents/Resources/runtime-health.mjs" | python3 -c \
            'import json,plistlib,sys; r = json.load(sys.stdin); p=plistlib.load(open(sys.argv[1],"rb")); assert r["protocol"] == 1 and r["streaming"] and r["tools"] and r["piVersion"] == p["TrendingTabPiVersion"] and "open_current_story" in r["toolNames"]' "$app/Contents/Info.plist"
          if [ -n "${NOTARY_KEYCHAIN_PROFILE:-}" ]; then
            zsh "$GITHUB_WORKSPACE/scripts/staple-with-retry.sh" "$app" validate
            spctl --assess --type execute "$app"
          fi

      - name: Exercise notarized runtime installation and rollback
        if: env.SIGNING_MODE == 'developer-id' && env.NOTARY_KEYCHAIN_PROFILE != ''
        run: |
          set -euo pipefail
          dmg="$(find "${RUNNER_TEMP}/release" -name 'TrendingTab-AgentRuntime-*.dmg' -print -quit)"
          test -n "$dmg"
          architecture="$(uname -m)"
          TRENDINGTAB_TEST_NOTARIZED_RUNTIME_DMG="$dmg" \
          TRENDINGTAB_TEST_NODE="$RUNNER_TEMP/agent-runtime-test/bin/node-$architecture" \
          TRENDINGTAB_TEST_RUNTIME="$RUNNER_TEMP/agent-runtime-test/runtime.mjs" \
          TRENDINGTAB_RUNTIME_DIAGNOSTICS=1 \
            swift test --filter AgentRuntimeManifestTests/testNotarizedRuntimeInstallAndRollback

      - name: Reject signed runtime image without a notarization ticket
        if: env.SIGNING_MODE == 'developer-id' && env.NOTARY_KEYCHAIN_PROFILE != ''
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/runtime-negative/TrendingTab-AgentRuntime-$RUNTIME_VERSION.dmg"
          test -f "$image"
          TRENDINGTAB_TEST_SIGNED_RUNTIME_DMG="$image" \
            swift test --filter AgentRuntimeManifestTests/testSignedImageStillRequiresNotarization

      - name: Create checksum
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release"
          for dmg in TrendingTab-*.dmg; do
            test -f "$dmg"
            shasum -a 256 "$dmg" > "$dmg.sha256"
            cat "$dmg.sha256"
          done

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: TrendingTab-DMG-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/release/TrendingTab-*.dmg
            ${{ runner.temp }}/release/TrendingTab-*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  verify-runtime-intel:
    needs: release
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: TrendingTab-DMG-${{ github.run_number }}
          path: ${{ runner.temp }}/release
      - name: Verify Agent Runtime on Intel
        env:
          RELEASE_BUILD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          cd "$RUNNER_TEMP/release"
          dmg="$(find . -maxdepth 1 -name 'TrendingTab-AgentRuntime-*.dmg' -print -quit)"
          test -n "$dmg"
          shasum -a 256 -c "$dmg.sha256"
          hdiutil verify "$dmg"
          if [ "$RELEASE_BUILD" = true ]; then
            codesign --verify --strict -R '=anchor apple generic and certificate leaf[subject.OU] = "GJUT2BVM7R" and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$dmg"
            zsh "$GITHUB_WORKSPACE/scripts/staple-with-retry.sh" "$dmg" validate
          fi
          hdiutil attach "$dmg" -readonly -nobrowse -plist > "$RUNNER_TEMP/runtime-intel-attach.plist"
          mount="$(python3 -c 'import plistlib,sys; p=plistlib.load(open(sys.argv[1],"rb")); print(next(e["mount-point"] for e in p["system-entities"] if "mount-point" in e))' "$RUNNER_TEMP/runtime-intel-attach.plist")"
          trap 'hdiutil detach "$mount" -quiet' EXIT
          app="$mount/AgentRuntime.app"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/node" -verify_arch x86_64
          if [ "$RELEASE_BUILD" = true ]; then
            codesign --verify --deep --strict -R '=anchor apple generic and identifier "dev.trendingtab.runtime" and certificate leaf[subject.OU] = "GJUT2BVM7R" and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$app"
            zsh "$GITHUB_WORKSPACE/scripts/staple-with-retry.sh" "$app" validate
            spctl --assess --type execute "$app"
          fi
          "$app/Contents/MacOS/node" "$app/Contents/Resources/runtime-health.mjs" | python3 -c \
            'import json,plistlib,sys; r = json.load(sys.stdin); p=plistlib.load(open(sys.argv[1],"rb")); assert r["protocol"] == 1 and r["streaming"] and r["tools"] and r["piVersion"] == p["TrendingTabPiVersion"] and "open_current_story" in r["toolNames"]' "$app/Contents/Info.plist"

  publish:
    needs: [release, verify-runtime-intel]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TrendingTab-DMG-${{ github.run_number }}
          path: ${{ runner.temp }}/release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg="$(find "${RUNNER_TEMP}/release" -name 'TrendingTab-[0-9]*.dmg' -print -quit)"
          test -n "$dmg"
          runtime_dmg="$(find "${RUNNER_TEMP}/release" -name 'TrendingTab-AgentRuntime-*.dmg' -print -quit)"
          test -n "$runtime_dmg"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 -c "$(basename "$dmg").sha256" && shasum -a 256 -c "$(basename "$runtime_dmg").sha256")
          runtime_name="$(basename "$runtime_dmg")"
          names="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .assets[]?.name')"
          checksum="$dmg.sha256"
          assets=("$dmg" "$checksum")
          if ! printf '%s\n' "$names" | grep -Fx "$runtime_name" >/dev/null; then
            assets+=("$runtime_dmg" "$runtime_dmg.sha256")
          fi
          version="$(basename "$dmg" .dmg)"
          version="${version#TrendingTab-}"
          tag="v${version}"

          signing="Developer ID 签名并已公证"

          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf '自动构建 `%s`，使用 %s。\n\n' "${GITHUB_SHA::12}" "$signing"
            printf '事件中心包含原文浏览器和流式 AI 对话，可使用应用内登录状态阅读及研究热点。支持配置模型、搜索服务和 MCP 工具。\n\n'
            printf '地址栏的站点信息可查看域名、页面连接状态、应用内登录身份和标签控制权限。预览 AI 页面及查看站点信息会保持 AI 操作；在网页内输入或交互会接管页面。\n\n'
            printf '模型连接保存工具调用测试结果。已完成测试但未调用工具的连接会暂停深度研究并显示原因，可继续使用直接回答；修改连接参数、密钥或请求头后可重新测试。\n\n'
            printf 'AI 可主动列出本对话的研究标签，后台页面保持挂载；读取、观察和滚动可短暂等待加载。普通输入框支持确认后填写，输入后重新观察，提交单独确认。网站可能在输入时发送请求；密码、验证码等字段由用户处理。\n\n'
            printf 'AI 工具发起的明确表单和按钮操作需要逐次确认；网页自身脚本可能未经确认发送后台请求。登录会话共享与浏览器边界详见 [AI 与提醒说明](https://github.com/tzf1003/TrendingTab/blob/main/docs/ai-and-alerts.md)。\n\n'
            printf 'AI 页面支持前台预览、连续追问和上下滚动，可读取懒加载内容；用户接管时撤销操作权限并关闭待确认操作。研究进度分别显示观察、读取、滚动和展开。\n\n'
            printf '每条回答按生成时可用的证据验证引用，后续研究新增材料用于新回答。\n\n'
            printf '自动重大事件摘要可选择匿名读取最多 3 篇公开原文，每篇使用最多 6,000 字摘录；默认关闭。正文仅在本轮内存中保留，读取失败时使用标题和已有摘要，模型请求继续遵守自动预算。\n\n'
            printf '搜索支持 Brave 新闻索引和 Tavily news 模式，保留时间与站点筛选；网页入口会注明通用搜索的材料范围。\n\n'
            printf '选择搜索 API 但尚未配置密钥时，自动使用所选网页搜索引擎，并在研究结果中说明。\n\n'
            printf '搜索结果可通过本轮证据编号打开，兼容 UUID 大小写与首尾空白；无效标识会提供本轮有效编号供研究继续。\n\n'
            printf '提供独立 Agent Runtime 组件；可在设置中检查兼容更新并回退。CI 校验两个 DMG、签名、公证和运行时安装回退。\n'
          } > "$notes"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TrendingTab ${version}" \
              --notes-file "$notes" \
              --latest
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TrendingTab ${version}" \
              --notes-file "$notes" \
              --latest
          fi
