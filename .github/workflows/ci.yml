name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Import signing certificate
        if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Build DMG
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
          OUTPUT_DIR: ${{ runner.temp }}/release
          NOTARY_KEYCHAIN_PROFILE: ${{ secrets.NOTARY_KEYCHAIN_PROFILE }}
        run: zsh scripts/package-dmg.sh

      - name: Verify DMG mounts
        run: |
          set -euo pipefail
          dmg="$(find "${RUNNER_TEMP}/release" -name 'TrendingTab-*.dmg' -print -quit)"
          test -n "$dmg"
          mount="$(hdiutil attach "$dmg" -nobrowse | awk '/\/Volumes\// { print $NF; exit }')"
          test -d "$mount/TrendingTab.app"
          codesign --verify --deep --strict --verbose=2 "$mount/TrendingTab.app"
          hdiutil detach "$mount"
          echo "Verified $dmg"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg="$(find "${RUNNER_TEMP}/release" -name 'TrendingTab-*.dmg' -print -quit)"
          tag="build-${GITHUB_SHA::12}"
          gh release create "$tag" "$dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TrendingTab ${GITHUB_SHA::12}" \
            --notes "CI 构建的 macOS DMG。未配置 Developer ID 与公证凭据时，此包使用 ad-hoc 签名，首次打开需要在系统设置中允许。" \
            --latest
