name: TrendingTab
options:
  bundleIdPrefix: dev.trendingtab
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: GJUT2BVM7R
    ENABLE_HARDENED_RUNTIME: YES
packages:
  TrendingTabKit:
    path: .
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.4.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.8.0
targets:
  TrendingTab:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [BrowserTheme, AppIcon.icon]
      - Shared
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      - path: App/BrowserTheme
        type: folder
        buildPhase: resources
    dependencies:
      - package: TrendingTabKit
        product: TrendingTabKit
      - target: TrendingTabWidget
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.trendingtab.app
        CODE_SIGN_ENTITLEMENTS: App/TrendingTab.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        PROVISIONING_PROFILE_SPECIFIER: "$(TRENDINGTAB_APP_PROFILE_ID)"
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: dev.trendingtab.app
            CFBundleURLSchemes: [trendingtab]
  TrendingTabWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: TrendingTabKit
        product: TrendingTabCore
      - package: TrendingTabKit
        product: TrendingTabWidgetBridge
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trendingtab.app.widget
        CODE_SIGN_ENTITLEMENTS: Widget/TrendingTabWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 热榜
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        PROVISIONING_PROFILE_SPECIFIER: "$(TRENDINGTAB_WIDGET_PROFILE_ID)"
        SKIP_INSTALL: YES
  TrendingTabBrowserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/BrowserWorkspace.swift
      - App/BrowserAudio.swift
      - App/BrowserSiteInformation.swift
      - App/BrowserToolBroker.swift
      - App/AppTheme.swift
      - Shared/SurfacePalette.swift
      - Tests/BrowserTests
      - path: App/BrowserTheme
        type: folder
        buildPhase: resources
    dependencies:
      - package: TrendingTabKit
        product: TrendingTabKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trendingtab.browser-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  TrendingTab:
    build:
      targets:
        TrendingTab: all
  TrendingTabBrowserTests:
    build:
      targets:
        TrendingTabBrowserTests: [test]
    test:
      targets:
        - TrendingTabBrowserTests
