name: TrendingTab
options:
  bundleIdPrefix: dev.trendingtab
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  TrendingTabKit:
    path: .
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.4.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.8.0
targets:
  TrendingTab:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: TrendingTabKit
        product: TrendingTabKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trendingtab.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
  TrendingTabWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
    dependencies:
      - package: TrendingTabKit
        product: TrendingTabKit
      - package: GRDB
        product: GRDB
      - package: SwiftSoup
        product: SwiftSoup
      - target: TrendingTab
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trendingtab.app.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_NSExtensionPrincipalClass: ""
